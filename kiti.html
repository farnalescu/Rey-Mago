<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="sand-canvas" aria-hidden="true"></canvas>

  <main>
    <header class="hero">
      <h1>&#129684; Kiti</h1>
      <p>Resuelve cada pista para avanzar</p>
    </header>

    <section class="gymkana">
      <p class="gymkana-progress" id="gymkana-progress"></p>

      <div class="gymkana-card" id="gymkana-card">
        <p class="gymkana-clue" id="gymkana-clue"></p>
        <form class="gymkana-form" id="gymkana-form">
          <input
            class="gymkana-input"
            id="gymkana-input"
            type="text"
            placeholder="Escribe tu respuesta"
            autocomplete="off"
            autocapitalize="off"
          />
          <button class="gymkana-submit" type="submit">Comprobar</button>
        </form>
        <p class="gymkana-feedback" id="gymkana-feedback" aria-live="polite"></p>
      </div>

      <div class="gymkana-complete" id="gymkana-complete" hidden>
        <h2>&#10022; ¡Gymkana completada! &#10022;</h2>
        <p>Has resuelto todas las pistas.</p>
      </div>

      <button class="gymkana-reset" id="gymkana-reset" type="button">Reiniciar gymkana</button>
    </section>

    <a class="card-link" href="index.html">
      <div class="card"><span class="icon">&#8617;</span><span class="name">Volver</span></div>
    </a>
  </main>

  <script src="sand-canvas.js"></script>
  <script src="card-effects.js"></script>
  <script src="kiti.js"></script>
</body>
</html>
