<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body data-theme="pink">
  <canvas id="sand-canvas" aria-hidden="true"></canvas>

  <main>
    <header class="hero">
      <h1>Kiti</h1>
      <p>Responde las preguntas una a una</p>
    </header>

    <section class="gymkana">
      <p class="gymkana-progress" id="gymkana-progress"></p>

      <div class="card-stack" id="card-stack" aria-live="polite"></div>
      <p class="gymkana-hint" id="gymkana-hint">Desliza la tarjeta para ver la siguiente pregunta</p>

      <div class="gymkana-complete" id="gymkana-complete" hidden>
        <h2>¡Gymkana completada!</h2>
        <p>Has respondido todas las preguntas.</p>
      </div>
    </section>
  </main>

  <script src="sand-canvas.js?v=2"></script>
  <script src="kiti.js?v=3"></script>
</body>
</html>
